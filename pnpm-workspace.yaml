packages:
  - 'apps/*'
  - 'packages/*'

# Preserve the dependency build-script choices from the generated web project.
# Prisma needs its postinstall to download the query engine binaries.
allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
  '@swc/core': true
  '@parcel/watcher': true
  # BullMQ works with msgpackr's JavaScript implementation; no native build needed.
  msgpackr-extract: false
  '@scarf/scarf': false
  '@prisma/engines': true
  '@prisma/client': true
  prisma: true
