name: researchos

# Local dependencies. Web, API and worker run with pnpm on the host.
services:
  ollama:
    profiles: [topic-suggestions]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.24.0}
    environment:
      OLLAMA_NO_CLOUD: "1"
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: researchos
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchos"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.2.11-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command:
      - mini
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3.allowedOrigins=${WEB_ORIGIN:-http://localhost:3000}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-researchos-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-researchos-local-secret}
      S3_BUCKET: ${S3_BUCKET:-researchos-local}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      # SeaweedFS web UIs: filer on 8888 (file browser, drag-and-drop upload),
      # master on 9333 (cluster status). Bound to loopback because they are
      # unauthenticated.
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.1-crf
    profiles: [grobid]
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"

volumes:
  ollama_models:
  postgres_data:
  redis_data:
  seaweedfs_data:
